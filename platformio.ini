; SkullGate — PlatformIO project configuration
; Supports ESP32, ESP32-S3, ESP32-C3 with Arduino framework.
; Libraries: LovyanGFX (display), LVGL (UI), ArduinoJson (config/modules).

[platformio]
default_envs = esp32dev
; Source root — PlatformIO compiles all .cpp under this directory tree.
src_dir = firmware

; ── Shared settings ──────────────────────────────────────────────────────────
[env]
framework = arduino
monitor_speed = 115200
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DBOARD_HAS_PSRAM
    ; LVGL config — point to our custom lv_conf.h inside firmware/core
    -DLV_CONF_INCLUDE_SIMPLE
    -I firmware/core
    -I firmware/drivers
    -I firmware/boards
lib_deps =
    lovyan03/LovyanGFX @ ^1.1.12
    lvgl/lvgl @ ^8.3.11
    bblanchon/ArduinoJson @ ^6.21.4

; ── ESP32 (generic dev board, 4 MB flash) ──────────────────────────────────────
[env:esp32dev]
platform  = espressif32
board     = esp32dev
; Include src/, core/, drivers/, modules/ but exclude examples/
build_src_filter =
    +<src/>
    +<core/>
    +<drivers/>
    +<modules/>
; Use built-in default 4 MB partition scheme (app0: 1.2MB, app1: 1.2MB, SPIFFS: 1.5MB)
board_build.partitions = default.csv

; ── ESP32-S3 (16 MB flash devkit) ────────────────────────────────────────────
[env:esp32-s3]
platform  = espressif32
board     = esp32-s3-devkitc-1
build_src_filter =
    +<src/>
    +<core/>
    +<drivers/>
    +<modules/>
; Use built-in 8 MB OTA partition scheme (works for both 8 MB and 16 MB flash)
board_build.partitions = default_8MB.csv
build_flags =
    ${env.build_flags}
    -DESP32_S3

; ── ESP32-C3 (4 MB flash devkit) ──────────────────────────────────────────────
[env:esp32-c3]
platform  = espressif32
board     = esp32-c3-devkitm-1
build_src_filter =
    +<src/>
    +<core/>
    +<drivers/>
    +<modules/>
; Use built-in default 4 MB partition scheme
board_build.partitions = default.csv
build_flags =
    ${env.build_flags}
    -DESP32_C3
