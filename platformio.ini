; SkullGate — PlatformIO project configuration
; Supports ESP32, ESP32-S3, ESP32-C3 with Arduino framework.
; Libraries: LovyanGFX (display), LVGL (UI), ArduinoJson (config/modules).

[platformio]
default_envs = esp32dev

; ── Shared settings ──────────────────────────────────────────────────────────
[env]
framework = arduino
monitor_speed = 115200
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DBOARD_HAS_PSRAM
    ; LVGL config — point to our custom lv_conf.h
    -DLV_CONF_INCLUDE_SIMPLE
    -I firmware/core
    -I firmware/drivers
lib_deps =
    lovyan03/LovyanGFX @ ^1.1.12
    lvgl/lvgl @ ^8.3.11
    bblanchon/ArduinoJson @ ^6.21.4

; ── ESP32 (generic dev board) ────────────────────────────────────────────────
[env:esp32dev]
platform  = espressif32
board     = esp32dev
build_src_filter = +<firmware/> -<firmware/modules/>
board_build.partitions = default_16MB.csv

; ── ESP32-S3 ─────────────────────────────────────────────────────────────────
[env:esp32-s3]
platform  = espressif32
board     = esp32-s3-devkitc-1
build_src_filter = +<firmware/> -<firmware/modules/>
board_build.partitions = default_16MB.csv
build_flags =
    ${env.build_flags}
    -DESP32_S3

; ── ESP32-C3 ─────────────────────────────────────────────────────────────────
[env:esp32-c3]
platform  = espressif32
board     = esp32-c3-devkitm-1
build_src_filter = +<firmware/> -<firmware/modules/>
build_flags =
    ${env.build_flags}
    -DESP32_C3
